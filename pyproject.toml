[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "traceward-core"
version = "0.1.0"
description = "Experimental evidence-first Java SQL injection scanner"
requires-python = ">=3.11,<3.15"
dependencies = ["tree-sitter==0.25.2", "tree-sitter-java==0.23.5", "pydantic==2.12.4"]

[project.scripts]
traceward = "traceward.cli:main"

[dependency-groups]
dev = ["pytest==9.0.1", "jsonschema==4.25.1", "ruff==0.14.5", "mypy==1.18.2"]

[tool.hatch.build.targets.wheel]
packages = ["packages/traceward-core/src/traceward"]

[tool.pytest.ini_options]
testpaths = ["packages/traceward-core/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

